[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose2actionLLM"
version = "0.1.0"
description = "Inspectable 2D pose preprocessing, visualization and LLM evaluation"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
