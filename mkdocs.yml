site_name: pose2actionLLM
site_url: https://ggh-png.github.io/pose2actionLLM/
site_description: 8개 관절 기반 Pose 시각화와 LLM 동작 분류 개발 문서
repo_url: https://github.com/ggh-png/pose2actionLLM
repo_name: ggh-png/pose2actionLLM
theme:
  name: material
  language: ko
  font: false
  palette:
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - 소개: index.md
  - 전체 처리 흐름: pipeline.md
  - 사용 가이드:
      - 설치와 빠른 시작: getting-started.md
      - 서버 최초 설치: server-setup.md
      - 서버 자동 실행과 피드백: server-automation.md
      - 8개 관절 데이터 형식: data-format.md
      - 시각화와 합성 데이터: visualization.md
      - 전처리와 Feature: preprocessing.md
      - LLM 평가와 모델 비교: evaluation.md
      - FastAPI: api.md
  - 개발 참고:
      - 코드 구조와 문서 관리: development.md
      - 개발 진행 현황: STATUS.md
      - 최초 시각화 요구사항: visualization-requirements.md
